<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owcza Kupa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
</head>

<body>

    <main class="app-container">

        <!-- EKRAN LOGOWANIA -->
        <section id="login-screen" class="login-screen">
            <div class="login-card">
                <h1>Owcza Kupa</h1>
                <hr>
                <form id="login-form">
                    <label for="username">Nazwa użytkownika</label>
                    <input type="text" id="username" placeholder="Wpisz nazwę użytkownika" autocomplete="username"
                        required>

                    <label for="password">Hasło</label>
                    <input type="password" id="password" placeholder="Wpisz hasło" autocomplete="current-password"
                        required>
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        Zapamiętaj mnie
                    </label>
                    <button type="submit" id="login-button">
                        Zaloguj się
                    </button>

                    <p id="login-error" class="error-message"></p>
                </form>
            </div>
        </section>

        <!-- GŁÓWNA APLIKACJA -->
        <section id="main-screen" class="hidden">


            <header class="main-header">
                <div>
                    <h1>Owcza Kupa</h1>
                </div>

                <div class="header-actions">
                    <button type="button" id="profile-button" class="profile-button" title="Profil">
                        <img id="header-avatar" src="default-avatar.png" alt="Profil">
                    </button>

                    <button type="button" id="logout-button" class="logout-button">
                        Wyloguj się
                    </button>
                </div>
            </header>


            <div class="welcome-section">
                <h2>Witaj ponownie!</h2>
            </div>

            <div class="stats-container">
                <div class="stat-card library-stat" id="watched-stat">
                    <span class="stat-number" id="watched-count">0</span>
                    <span>Obejrzane filmy</span>
                </div>

                <div class="stat-card library-stat" id="watchlist-stat">
                    <span class="stat-number" id="watchlist-count">0</span>
                    <span>Filmy do obejrzenia</span>
                </div>
            </div>

            <div class="search-section">
                <h2>Wyszukaj filmy</h2>

                <form id="movie-search-form">
                    <input type="text" id="movie-search-input" placeholder="Wpisz tytuł filmu..." required>
                    <select id="movie-year">
                        <option value="">Wszystkie lata</option>
                    </select>
                    <button type="submit">Szukaj</button>
                </form>

                <p id="search-error" class="error-message"></p>

                <div id="search-results" class="movie-grid"></div>
            </div>

            <section class="library-section">
                <h2>Biblioteka filmów</h2>

                <div class="library-tabs">
                    <button type="button" id="watchlist-tab" class="library-tab active">
                        Do obejrzenia
                    </button>

                    <button type="button" id="watched-tab" class="library-tab">
                        Obejrzane
                    </button>

                    <button type="button" id="users-tab" class="library-tab">
                        Użytkownicy
                    </button>
                </div>

                <div id="library-movies" class="movie-grid"></div>

                <!-- PUBLIC USERS -->
                <div id="users-section" class="hidden">

                    <div id="users-list" class="movie-grid"></div>

                    <!-- Selected user's library -->
                    <div id="user-library-view" class="hidden">
                        <button type="button" id="back-to-users">
                            ‹ Wróć do użytkowników
                        </button>

                        <div class="public-profile-header">
                            <img id="selected-user-avatar" src="default-avatar.png" alt="Zdjęcie profilowe">

                            <h3 id="selected-username"></h3>
                        </div>
                        <div class="library-tabs">
                            <button type="button" id="public-watchlist-tab" class="library-tab active">
                                Do obejrzenia
                            </button>

                            <button type="button" id="public-watched-tab" class="library-tab">
                                Obejrzane
                            </button>
                        </div>

                        <div id="user-library-movies" class="movie-grid"></div>
                    </div>

                </div>
            </section>

        </section>

    </main>

    <button type="button" id="back-to-top" title="Wróć na górę">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"></path>
            <path d="M5 12L12 5L19 12"></path>
        </svg>
    </button>

    <div id="profile-modal" class="profile-modal hidden">
        <div class="profile-modal-content">
            <button id="close-profile-modal" type="button">×</button>

            <h2>Twoje Profilowe</h2>

            <img id="profile-preview" src="default-avatar.png" alt="Zdjęcie profilowe">

            <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/webp">

            <button id="save-avatar-button" type="button">
                Zapisz zdjęcie
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/script.js"></script>
</body>

</html>
